# Postgres-backed (CloudNativePG): safe to scale out. Schema migrations are owned by
# the migrate Job (k8s/migrate-job.yaml), not the pods, so replicas don't race on
# `alembic upgrade` — hence RUN_MIGRATIONS_ON_STARTUP=false below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prep-tracker
  labels:
    app: prep-tracker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: prep-tracker
  template:
    metadata:
      labels:
        app: prep-tracker
    spec:
      containers:
        - name: prep-tracker
          image: ghcr.io/thetaskmaster42/prep-tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Connection string from the CloudNativePG-generated secret (<cluster>-app).
            # The app pins the psycopg driver automatically, so the plain URI works as-is.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prep-tracker-db-app
                  key: uri
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
